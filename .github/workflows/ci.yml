name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build e testes
    runs-on: ubuntu-latest

    steps:
      - name: Baixa o codigo
        uses: actions/checkout@v4

      # Temurin 8: mesma linha usada no Dockerfile e exigida pelo Spring Boot 2.7.
      - name: Configura o JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven

      # Os testes de integracao sobem um PostgreSQL 16 via Testcontainers.
      # O runner do GitHub ja tem Docker, entao nao e preciso servico extra no workflow.
      - name: Build e testes
        run: ./mvnw -B --no-transfer-progress verify

      - name: Publica o relatorio dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-surefire
          path: target/surefire-reports/
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    name: Deploy no Render
    runs-on: ubuntu-latest
    needs: build
    # So a main publica, e so depois dos testes passarem. Pull request nao faz deploy.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Dispara o deploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK nao configurado nos secrets do repositorio."
            echo "O build passou, mas nenhum deploy foi disparado."
            exit 0
          fi
          curl --fail --silent --show-error "$RENDER_DEPLOY_HOOK"
          echo "Deploy solicitado ao Render."
