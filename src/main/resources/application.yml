spring:
  application:
    name: clareza-api

  datasource:
    # URL no formato JDBC. O Neon entrega no formato postgresql://user:senha@host/db —
    # a conversao para jdbc:postgresql://... e responsabilidade da variavel de ambiente.
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/clareza}
    username: ${DATABASE_USER:clareza}
    password: ${DATABASE_PASSWORD:clareza}
    hikari:
      # O free tier do Neon tem teto baixo de conexoes; o default do Hikari (10) desperdica orcamento.
      maximum-pool-size: 5
      pool-name: clareza-pool

  jpa:
    hibernate:
      # O schema e responsabilidade do Flyway — o Hibernate apenas confere.
      ddl-auto: validate
    # Sem lazy loading vazando para a camada web.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

clareza:
  cors:
    # Lista separada por virgula. Em producao, a origem do frontend na Vercel/Cloudflare Pages.
    origens-permitidas: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
