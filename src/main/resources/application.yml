spring:
  application:
    name: clareza-api

  datasource:
    # URL no formato JDBC. O Neon entrega no formato postgresql://user:senha@host/db —
    # a conversao para jdbc:postgresql://... e responsabilidade da variavel de ambiente.
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/clareza}
    username: ${DATABASE_USER:clareza}
    password: ${DATABASE_PASSWORD:clareza}
    hikari:
      # O free tier do Neon tem teto baixo de conexoes; o default do Hikari (10) desperdica orcamento.
      maximum-pool-size: 5
      pool-name: clareza-pool

  jpa:
    hibernate:
      # O schema e responsabilidade do Flyway — o Hibernate apenas confere.
      ddl-auto: validate
    # Sem lazy loading vazando para a camada web.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

clareza:
  # "Hoje" e sempre o dia do usuario, nao o do servidor: em UTC, das 21h a meia-noite o
  # servidor ja estaria no dia seguinte, marcando como atrasado o que vence hoje.
  fuso-horario: ${APP_TIMEZONE:America/Sao_Paulo}

  jwt:
    # Precisa de no minimo 32 bytes para o HS256. Em producao vem do ambiente.
    segredo: ${JWT_SECRET:segredo-apenas-de-desenvolvimento-local-troque-em-producao}
    expiracao-minutos: ${JWT_EXPIRATION_MINUTES:60}

  google:
    # Sem isso o /api/auth/google responde 401 explicando que o login social nao esta configurado.
    client-id: ${GOOGLE_CLIENT_ID:}

  cors:
    # Lista separada por virgula. Em producao, a origem do frontend na Vercel/Cloudflare Pages.
    origens-permitidas: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

springdoc:
  # Desligue em producao com SWAGGER_ENABLED=false se nao quiser a API documentada em publico.
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
